<figure class="diagram">
<svg viewBox="0 0 660 280" role="img" aria-label="Two declared budgets form a rectangle. A run walks a staircase inside it, and the step that would cross the tool-calls edge is refused and never executed rather than being clipped back to the boundary.">
  <defs>
    <marker id="bud-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="bud-deny" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--deny, #b3341f)"/>
    </marker>
  </defs>

  <text x="18" y="22" font-size="12" font-weight="600" fill="currentColor">A budget is a region; a run is a path inside it</text>

  <!-- the declared region -->
  <rect x="70" y="52" width="300" height="180" rx="4" fill="currentColor" opacity="0.06"/>
  <rect x="70" y="52" width="300" height="180" rx="4" fill="none" stroke="currentColor"
        stroke-width="1.5" opacity="0.55"/>

  <!-- axes -->
  <line x1="70" y1="232" x2="400" y2="232" stroke="currentColor" stroke-width="1.5" marker-end="url(#bud-arrow)"/>
  <line x1="70" y1="232" x2="70" y2="40" stroke="currentColor" stroke-width="1.5" marker-end="url(#bud-arrow)"/>
  <text x="404" y="236" font-size="11" fill="currentColor">tool_calls</text>
  <text x="46" y="44" font-size="11" text-anchor="middle" fill="currentColor">cost</text>

  <text x="70" y="250" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">0</text>
  <text x="370" y="250" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">3</text>
  <text x="56" y="56" font-size="10" text-anchor="end" fill="currentColor" opacity="0.7">100</text>

  <!-- the staircase: each charge moves right and up -->
  <polyline points="70,232 170,232 170,196 270,196 270,150 370,150"
            fill="none" stroke="currentColor" stroke-width="2.4"/>
  <circle cx="170" cy="232" r="3.5" fill="currentColor"/>
  <circle cx="270" cy="196" r="3.5" fill="currentColor"/>
  <circle cx="370" cy="150" r="3.5" fill="currentColor"/>
  <text x="120" y="224" font-size="10" fill="currentColor" opacity="0.8">call 1</text>
  <text x="220" y="188" font-size="10" fill="currentColor" opacity="0.8">call 2</text>
  <text x="320" y="142" font-size="10" fill="currentColor" opacity="0.8">call 3</text>

  <!-- the refused step -->
  <line x1="370" y1="150" x2="440" y2="150" stroke="var(--deny, #b3341f)" stroke-width="2.4"
        stroke-dasharray="6 4" marker-end="url(#bud-deny)"/>
  <text x="392" y="140" font-size="11" fill="var(--deny, #b3341f)">call 4</text>

  <text x="450" y="72" font-size="12" font-weight="600" fill="currentColor">At the edge</text>
  <text x="450" y="96" font-size="11" fill="var(--deny, #b3341f)">budget_exhausted</text>
  <text x="450" y="118" font-size="11" fill="currentColor" opacity="0.8">the action never runs</text>
  <text x="450" y="136" font-size="11" fill="currentColor" opacity="0.8">nothing is charged</text>
  <text x="450" y="154" font-size="11" fill="currentColor" opacity="0.8">the run is halted</text>

  <text x="450" y="188" font-size="11" fill="currentColor" opacity="0.75">not clipped back to</text>
  <text x="450" y="204" font-size="11" fill="currentColor" opacity="0.75">the boundary, and not</text>
  <text x="450" y="220" font-size="11" fill="currentColor" opacity="0.75">resumed on the other axis</text>
</svg>
<figcaption>Each charge is a step, and the declared limits are the edges of the region. The step that would leave it is refused whole — the path stops rather than being trimmed to fit, which is why nothing is partially charged.</figcaption>
</figure>
