<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>concurrent-append-integrity — demo</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --ink: #1a1a18; --muted: #6b6b66;
    --line: #e4e4e0; --allow: #1d7a4c; --allow-bg: #e8f5ee;
    --deny: #b3341f; --deny-bg: #fbeae6; --accent: #3b5bdb; --mono-bg: #f4f4f1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a; --panel: #1e2024; --ink: #e9e9e6; --muted: #9a9a94;
      --line: #32343a; --allow: #56c98c; --allow-bg: #163024;
      --deny: #f0836a; --deny-bg: #331a15; --accent: #8fa6f5; --mono-bg: #24262b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16171a; --panel: #1e2024; --ink: #e9e9e6; --muted: #9a9a94;
    --line: #32343a; --allow: #56c98c; --allow-bg: #163024;
    --deny: #f0836a; --deny-bg: #331a15; --accent: #8fa6f5; --mono-bg: #24262b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 20px; }
  .claim {
    border-left: 3px solid var(--accent); padding: 12px 16px; margin: 0 0 28px;
    background: var(--panel); border-radius: 0 8px 8px 0; font-size: 0.95rem;
  }
  .claim b { display: block; font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  figure.diagram {
    margin: 0 0 24px; padding: 18px 16px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--panel); color: var(--ink);
  }
  figure.diagram svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  figure.diagram figcaption {
    margin-top: 12px; font-size: 0.84rem; color: var(--muted); text-align: center;
  }
  .stage { border: 1px solid var(--line); border-radius: 12px;
    background: var(--panel); padding: 20px; min-height: 260px; }
  .steplabel { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px;
    letter-spacing: 0.04em; text-transform: uppercase; }
  .request {
    background: var(--mono-bg); border-radius: 8px; padding: 12px 14px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.83rem; white-space: pre-wrap; word-break: break-word;
    opacity: 0; transform: translateY(-8px);
    animation: enter .32s ease forwards;
  }
  .gate {
    margin: 14px 0; text-align: center; font-size: 0.75rem; color: var(--muted);
    letter-spacing: 0.1em; text-transform: uppercase;
    opacity: 0; animation: enter .3s ease .22s forwards;
  }
  .verdict {
    border-radius: 8px; padding: 14px 16px; border: 1px solid;
    opacity: 0; transform: scale(.97);
    animation: stamp .34s cubic-bezier(.2,.9,.3,1.2) .46s forwards;
  }
  .verdict.allowed { border-color: var(--allow); background: var(--allow-bg); }
  .verdict.denied  { border-color: var(--deny);  background: var(--deny-bg); }
  .tag { font-weight: 700; font-size: 0.78rem; letter-spacing: 0.09em; }
  .verdict.allowed .tag { color: var(--allow); }
  .verdict.denied  .tag { color: var(--deny); }
  .reason {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.85rem; margin-top: 6px; word-break: break-word;
  }
  .detail { color: var(--muted); font-size: 0.8rem; margin-top: 6px;
    font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-word; }
  .evidence {
    margin-top: 12px; font-size: 0.82rem; color: var(--muted);
    opacity: 0; animation: enter .3s ease .76s forwards;
  }
  .evidence b { color: var(--ink); font-weight: 600; }
  .note { margin-top: 10px; font-size: 0.85rem; color: var(--muted); font-style: italic;
    opacity: 0; animation: enter .3s ease .86s forwards; }
  @keyframes enter { to { opacity: 1; transform: none; } }
  @keyframes stamp { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .request, .gate, .verdict, .evidence, .note { animation-duration: .01ms; }
  }
  .controls { display: flex; gap: 8px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 0.85rem; padding: 7px 14px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  .dots { display: flex; gap: 6px; margin-left: auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--accent); }
  .dot.done.allowed { background: var(--allow); }
  .dot.done.denied { background: var(--deny); }
  footer { margin-top: 22px; font-size: 0.76rem; color: var(--muted); }
  code { background: var(--mono-bg); padding: 1px 5px; border-radius: 4px;
    font-size: 0.85em; font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="app"></h1>
  <div class="meta" id="meta"></div>
  <div class="claim"><b>Atomic claim</b><span id="claim"></span></div>

  <figure class="diagram">
<svg viewBox="0 0 700 250" role="img" aria-label="A hash chain is a line: each entry names the entry before it. Two uncoordinated writers that read the same head both name it, turning the line into a fork. Compare-and-swap admits one of them and rejects the other, keeping the line.">
  <defs>
    <marker id="cai-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="cai-deny" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--deny, #b3341f)"/>
    </marker>
  </defs>

  <text x="18" y="22" font-size="12" font-weight="600" fill="currentColor">Uncoordinated: the line becomes a fork</text>
  <text x="400" y="22" font-size="12" font-weight="600" fill="currentColor">Compare-and-swap: one wins</text>

  <!-- left: fork -->
  <circle cx="44" cy="110" r="16" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="44" y="114" font-size="10" text-anchor="middle" fill="currentColor">gen</text>
  <line x1="62" y1="110" x2="104" y2="110" stroke="currentColor" stroke-width="1.5" marker-end="url(#cai-arrow)"/>

  <circle cx="126" cy="110" r="16" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="126" y="114" font-size="10" text-anchor="middle" fill="currentColor">e0</text>

  <line x1="142" y1="102" x2="196" y2="72" stroke="var(--deny, #b3341f)" stroke-width="1.8" marker-end="url(#cai-deny)"/>
  <line x1="142" y1="118" x2="196" y2="148" stroke="var(--deny, #b3341f)" stroke-width="1.8" marker-end="url(#cai-deny)"/>

  <circle cx="218" cy="62" r="16" fill="none" stroke="var(--deny, #b3341f)" stroke-width="1.5"/>
  <text x="218" y="66" font-size="10" text-anchor="middle" fill="var(--deny, #b3341f)">e1</text>
  <text x="248" y="58" font-size="10" fill="currentColor" opacity="0.8">writer a</text>

  <circle cx="218" cy="158" r="16" fill="none" stroke="var(--deny, #b3341f)" stroke-width="1.5"/>
  <text x="218" y="162" font-size="10" text-anchor="middle" fill="var(--deny, #b3341f)">e1</text>
  <text x="248" y="164" font-size="10" fill="currentColor" opacity="0.8">writer b</text>

  <text x="60" y="198" font-size="11" fill="var(--deny, #b3341f)">both name e0 as their predecessor</text>
  <text x="60" y="216" font-size="11" fill="currentColor" opacity="0.75">verify() → chain_broken at index 1</text>

  <!-- right: cas keeps the line -->
  <circle cx="420" cy="110" r="16" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="420" y="114" font-size="10" text-anchor="middle" fill="currentColor">gen</text>
  <line x1="438" y1="110" x2="480" y2="110" stroke="currentColor" stroke-width="1.5" marker-end="url(#cai-arrow)"/>

  <circle cx="502" cy="110" r="16" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="502" y="114" font-size="10" text-anchor="middle" fill="currentColor">e0</text>
  <line x1="520" y1="110" x2="562" y2="110" stroke="currentColor" stroke-width="1.5" marker-end="url(#cai-arrow)"/>

  <circle cx="584" cy="110" r="16" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="584" y="114" font-size="10" text-anchor="middle" fill="currentColor">e1</text>
  <text x="608" y="100" font-size="10" fill="currentColor" opacity="0.8">writer a</text>

  <line x1="518" y1="122" x2="566" y2="156" stroke="var(--deny, #b3341f)" stroke-width="1.8"
        stroke-dasharray="5 4" marker-end="url(#cai-deny)"/>
  <text x="578" y="162" font-size="10" fill="var(--deny, #b3341f)">writer b</text>
  <text x="578" y="178" font-size="10" fill="var(--deny, #b3341f)">head_moved</text>

  <text x="420" y="216" font-size="11" fill="currentColor" opacity="0.75">the head each writer built on is named, and checked</text>
</svg>
<figcaption>A hash chain is a line because every entry names the one before it. Two writers that read the same head both name it and the line becomes a fork; compare-and-swap rejects the writer whose predecessor moved, so exactly one append lands.</figcaption>
</figure>

  <div class="stage" id="stage"></div>

  <div class="controls">
    <button id="prev">Back</button>
    <button id="next">Next</button>
    <button id="replay">Replay</button>
    <div class="dots" id="dots"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script id="trace" type="application/json">{
  "app": "concurrent-append-integrity",
  "claim": "Under concurrent writers an append-only ledger admits exactly one entry per accepted append, with contiguous indices and an unbroken hash chain \u2014 a writer whose predecessor moved is rejected.",
  "enforcement": "deterministic",
  "denial_type": "ConcurrentAppendRejected",
  "steps": [
    {
      "label": "two uncoordinated writers that both read the same head",
      "request": {
        "writer a": "prev_hash = genesis",
        "writer b": "prev_hash = genesis (stale)",
        "coordination": "none"
      },
      "outcome": "denied",
      "result": "",
      "reason": "chain_broken at entry 1",
      "detail": "",
      "evidence": "the hazard, staged as an explicit interleaving rather than a race, so it is deterministic",
      "note": "Both entries claim the same predecessor. The chain no longer describes an order."
    },
    {
      "label": "8 threads racing, each naming the head it built on",
      "request": {
        "writers": 8,
        "discipline": "compare-and-swap",
        "all read head": "before the barrier released"
      },
      "outcome": "allowed",
      "result": "chain intact",
      "reason": "",
      "detail": "",
      "evidence": "1 accepted, 7 rejected as head_moved; ledger holds 1 entry",
      "note": "Exactly one wins. The assertion holds under every possible scheduling, so the test is not timing-dependent."
    },
    {
      "label": "8 threads serialized through one lock",
      "request": {
        "writers": 8,
        "discipline": "read head and extend under a lock"
      },
      "outcome": "allowed",
      "result": "chain intact",
      "reason": "",
      "detail": "",
      "evidence": "8 accepted, 0 rejected; indices [0, 1, 2, 3, 4, 5, 6, 7]",
      "note": "No gaps, no duplicates, nothing lost \u2014 the other legitimate discipline."
    }
  ]
}</script>
<script>
  const data = JSON.parse(document.getElementById("trace").textContent);
  const stage = document.getElementById("stage");
  const dots = document.getElementById("dots");
  let i = 0;

  document.getElementById("app").textContent = data.app;
  document.getElementById("claim").textContent = data.claim;
  document.getElementById("meta").textContent =
    data.enforcement + " · denials raise " + data.denial_type +
    " · " + data.steps.length + " steps";
  document.getElementById("foot").innerHTML =
    "Every step on this page was produced by running the app's real module, " +
    "not reimplemented in JavaScript. Regenerate with <code>python demo.py</code>.";

  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function render(n) {
    const s = data.steps[n];
    const req = Object.entries(s.request)
      .map(([k, v]) => k + ": " + (typeof v === "string" ? v : JSON.stringify(v)))
      .join("\n");

    let verdict = '<div class="verdict ' + s.outcome + '" data-outcome="' + s.outcome + '">' +
      '<div class="tag">' + (s.outcome === "allowed" ? "ALLOWED" : "DENIED") + "</div>";
    if (s.outcome === "denied") {
      verdict += '<div class="reason" data-reason="' + esc(s.reason) + '">' + esc(s.reason) + "</div>";
      if (s.detail) verdict += '<div class="detail">' + esc(s.detail) + "</div>";
    } else if (s.result) {
      verdict += '<div class="reason">' + esc(s.result) + "</div>";
    }
    verdict += "</div>";

    stage.innerHTML =
      '<div class="steplabel">Step ' + (n + 1) + " of " + data.steps.length +
        " — " + esc(s.label) + "</div>" +
      '<div class="request">' + esc(req) + "</div>" +
      '<div class="gate">&darr; gate &darr;</div>' +
      verdict +
      (s.evidence ? '<div class="evidence"><b>Evidence:</b> ' + esc(s.evidence) + "</div>" : "") +
      (s.note ? '<div class="note">' + esc(s.note) + "</div>" : "");

    dots.innerHTML = data.steps.map((st, k) =>
      '<div class="dot ' + (k === n ? "on" : k < n ? "done " + st.outcome : "") + '"></div>'
    ).join("");

    document.getElementById("prev").disabled = n === 0;
    document.getElementById("next").disabled = n === data.steps.length - 1;
    stage.dataset.step = String(n);
  }

  document.getElementById("next").onclick = () => render(++i);
  document.getElementById("prev").onclick = () => render(--i);
  document.getElementById("replay").onclick = () => render(i = 0);
  render(0);
</script>
</body>
</html>
