<figure class="diagram">
<svg viewBox="0 0 660 280" role="img" aria-label="Capability sets ordered by inclusion. A delegation chain descends from read-write-deploy to read-write to read. An arrow back up the lattice, from read to read plus deploy, is refused as amplification.">
  <defs>
    <marker id="del-down" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="del-up" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--deny, #b3341f)"/>
    </marker>
  </defs>

  <text x="18" y="22" font-size="12" font-weight="600" fill="currentColor">Authority is a set, ordered by inclusion</text>
  <text x="18" y="270" font-size="11" fill="currentColor" opacity="0.75">r = repo.read &#160; w = repo.write &#160; d = deploy.execute</text>

  <!-- lattice levels -->
  <text x="160" y="56" font-size="12" text-anchor="middle" fill="currentColor">{ r, w, d }</text>
  <text x="70" y="126" font-size="12" text-anchor="middle" fill="currentColor">{ r, w }</text>
  <text x="180" y="126" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.45">{ r, d }</text>
  <text x="285" y="126" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.45">{ w, d }</text>
  <text x="70" y="196" font-size="12" text-anchor="middle" fill="currentColor">{ r }</text>
  <text x="180" y="196" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.45">{ w }</text>
  <text x="285" y="196" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.45">{ d }</text>
  <text x="180" y="248" font-size="12" text-anchor="middle" fill="currentColor" opacity="0.45">{ }</text>

  <!-- faint lattice edges -->
  <g stroke="currentColor" stroke-width="1" opacity="0.18">
    <line x1="152" y1="62" x2="80" y2="112"/><line x1="165" y1="62" x2="180" y2="112"/>
    <line x1="175" y1="62" x2="280" y2="112"/>
    <line x1="66" y1="132" x2="66" y2="182"/><line x1="80" y1="132" x2="172" y2="182"/>
    <line x1="182" y1="132" x2="80" y2="182"/><line x1="188" y1="132" x2="280" y2="182"/>
    <line x1="283" y1="132" x2="190" y2="182"/><line x1="292" y1="132" x2="292" y2="182"/>
    <line x1="72" y1="202" x2="172" y2="236"/><line x1="180" y1="202" x2="180" y2="236"/>
    <line x1="284" y1="202" x2="190" y2="236"/>
  </g>

  <!-- the delegation chain: strictly downward -->
  <line x1="148" y1="62" x2="84" y2="112" stroke="currentColor" stroke-width="2.2" marker-end="url(#del-down)"/>
  <line x1="70" y1="132" x2="70" y2="180" stroke="currentColor" stroke-width="2.2" marker-end="url(#del-down)"/>
  <text x="210" y="84" font-size="11" fill="currentColor">orchestrator delegates</text>
  <text x="96" y="160" font-size="11" fill="currentColor">planner delegates</text>

  <!-- the refused step: upward -->
  <line x1="84" y1="190" x2="172" y2="134" stroke="var(--deny, #b3341f)" stroke-width="2.2"
        stroke-dasharray="5 4" marker-end="url(#del-up)"/>
  <text x="330" y="176" font-size="11" fill="var(--deny, #b3341f)">worker claims { r, d }</text>
  <text x="330" y="194" font-size="11" fill="var(--deny, #b3341f)">amplified_capability</text>

  <text x="430" y="56" font-size="12" font-weight="600" fill="currentColor">Every link may only descend</text>
  <text x="430" y="82" font-size="11" fill="currentColor" opacity="0.8">orchestrator &#8594; { r, w, d }</text>
  <text x="430" y="102" font-size="11" fill="currentColor" opacity="0.8">planner &#160;&#160;&#160;&#160;&#8594; { r, w }</text>
  <text x="430" y="122" font-size="11" fill="currentColor" opacity="0.8">worker &#160;&#160;&#160;&#160;&#160;&#8594; { r }</text>
  <text x="430" y="150" font-size="11" fill="currentColor" opacity="0.75">the effective set is what</text>
  <text x="430" y="166" font-size="11" fill="currentColor" opacity="0.75">survived every link</text>
</svg>
<figcaption>Delegation is a descent. Each link holds a subset of the link above it, so the effective authority is whatever survives the whole chain — and a step back up the lattice is the failure the app refuses.</figcaption>
</figure>
