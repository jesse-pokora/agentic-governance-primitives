<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bounded-execution-budget — demo</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --ink: #1a1a18; --muted: #6b6b66;
    --line: #e4e4e0; --allow: #1d7a4c; --allow-bg: #e8f5ee;
    --deny: #b3341f; --deny-bg: #fbeae6; --accent: #3b5bdb; --mono-bg: #f4f4f1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a; --panel: #1e2024; --ink: #e9e9e6; --muted: #9a9a94;
      --line: #32343a; --allow: #56c98c; --allow-bg: #163024;
      --deny: #f0836a; --deny-bg: #331a15; --accent: #8fa6f5; --mono-bg: #24262b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16171a; --panel: #1e2024; --ink: #e9e9e6; --muted: #9a9a94;
    --line: #32343a; --allow: #56c98c; --allow-bg: #163024;
    --deny: #f0836a; --deny-bg: #331a15; --accent: #8fa6f5; --mono-bg: #24262b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 20px; }
  .claim {
    border-left: 3px solid var(--accent); padding: 12px 16px; margin: 0 0 28px;
    background: var(--panel); border-radius: 0 8px 8px 0; font-size: 0.95rem;
  }
  .claim b { display: block; font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  figure.diagram {
    margin: 0 0 24px; padding: 18px 16px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--panel); color: var(--ink);
  }
  figure.diagram svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  figure.diagram figcaption {
    margin-top: 12px; font-size: 0.84rem; color: var(--muted); text-align: center;
  }
  .stage { border: 1px solid var(--line); border-radius: 12px;
    background: var(--panel); padding: 20px; min-height: 260px; }
  .steplabel { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px;
    letter-spacing: 0.04em; text-transform: uppercase; }
  .request {
    background: var(--mono-bg); border-radius: 8px; padding: 12px 14px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.83rem; white-space: pre-wrap; word-break: break-word;
    opacity: 0; transform: translateY(-8px);
    animation: enter .32s ease forwards;
  }
  .gate {
    margin: 14px 0; text-align: center; font-size: 0.75rem; color: var(--muted);
    letter-spacing: 0.1em; text-transform: uppercase;
    opacity: 0; animation: enter .3s ease .22s forwards;
  }
  .verdict {
    border-radius: 8px; padding: 14px 16px; border: 1px solid;
    opacity: 0; transform: scale(.97);
    animation: stamp .34s cubic-bezier(.2,.9,.3,1.2) .46s forwards;
  }
  .verdict.allowed { border-color: var(--allow); background: var(--allow-bg); }
  .verdict.denied  { border-color: var(--deny);  background: var(--deny-bg); }
  .tag { font-weight: 700; font-size: 0.78rem; letter-spacing: 0.09em; }
  .verdict.allowed .tag { color: var(--allow); }
  .verdict.denied  .tag { color: var(--deny); }
  .reason {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.85rem; margin-top: 6px; word-break: break-word;
  }
  .detail { color: var(--muted); font-size: 0.8rem; margin-top: 6px;
    font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-word; }
  .evidence {
    margin-top: 12px; font-size: 0.82rem; color: var(--muted);
    opacity: 0; animation: enter .3s ease .76s forwards;
  }
  .evidence b { color: var(--ink); font-weight: 600; }
  .note { margin-top: 10px; font-size: 0.85rem; color: var(--muted); font-style: italic;
    opacity: 0; animation: enter .3s ease .86s forwards; }
  @keyframes enter { to { opacity: 1; transform: none; } }
  @keyframes stamp { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .request, .gate, .verdict, .evidence, .note { animation-duration: .01ms; }
  }
  .controls { display: flex; gap: 8px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 0.85rem; padding: 7px 14px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  .dots { display: flex; gap: 6px; margin-left: auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--accent); }
  .dot.done.allowed { background: var(--allow); }
  .dot.done.denied { background: var(--deny); }
  footer { margin-top: 22px; font-size: 0.76rem; color: var(--muted); }
  code { background: var(--mono-bg); padding: 1px 5px; border-radius: 4px;
    font-size: 0.85em; font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="app"></h1>
  <div class="meta" id="meta"></div>
  <div class="claim"><b>Atomic claim</b><span id="claim"></span></div>

  <figure class="diagram">
<svg viewBox="0 0 660 280" role="img" aria-label="Two declared budgets form a rectangle. A run walks a staircase inside it, and the step that would cross the tool-calls edge is refused and never executed rather than being clipped back to the boundary.">
  <defs>
    <marker id="bud-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="bud-deny" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--deny, #b3341f)"/>
    </marker>
  </defs>

  <text x="18" y="22" font-size="12" font-weight="600" fill="currentColor">A budget is a region; a run is a path inside it</text>

  <!-- the declared region -->
  <rect x="70" y="52" width="300" height="180" rx="4" fill="currentColor" opacity="0.06"/>
  <rect x="70" y="52" width="300" height="180" rx="4" fill="none" stroke="currentColor"
        stroke-width="1.5" opacity="0.55"/>

  <!-- axes -->
  <line x1="70" y1="232" x2="400" y2="232" stroke="currentColor" stroke-width="1.5" marker-end="url(#bud-arrow)"/>
  <line x1="70" y1="232" x2="70" y2="40" stroke="currentColor" stroke-width="1.5" marker-end="url(#bud-arrow)"/>
  <text x="404" y="236" font-size="11" fill="currentColor">tool_calls</text>
  <text x="46" y="44" font-size="11" text-anchor="middle" fill="currentColor">cost</text>

  <text x="70" y="250" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">0</text>
  <text x="370" y="250" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">3</text>
  <text x="56" y="56" font-size="10" text-anchor="end" fill="currentColor" opacity="0.7">100</text>

  <!-- the staircase: each charge moves right and up -->
  <polyline points="70,232 170,232 170,196 270,196 270,150 370,150"
            fill="none" stroke="currentColor" stroke-width="2.4"/>
  <circle cx="170" cy="232" r="3.5" fill="currentColor"/>
  <circle cx="270" cy="196" r="3.5" fill="currentColor"/>
  <circle cx="370" cy="150" r="3.5" fill="currentColor"/>
  <text x="120" y="224" font-size="10" fill="currentColor" opacity="0.8">call 1</text>
  <text x="220" y="188" font-size="10" fill="currentColor" opacity="0.8">call 2</text>
  <text x="320" y="142" font-size="10" fill="currentColor" opacity="0.8">call 3</text>

  <!-- the refused step -->
  <line x1="370" y1="150" x2="440" y2="150" stroke="var(--deny, #b3341f)" stroke-width="2.4"
        stroke-dasharray="6 4" marker-end="url(#bud-deny)"/>
  <text x="392" y="140" font-size="11" fill="var(--deny, #b3341f)">call 4</text>

  <text x="450" y="72" font-size="12" font-weight="600" fill="currentColor">At the edge</text>
  <text x="450" y="96" font-size="11" fill="var(--deny, #b3341f)">budget_exhausted</text>
  <text x="450" y="118" font-size="11" fill="currentColor" opacity="0.8">the action never runs</text>
  <text x="450" y="136" font-size="11" fill="currentColor" opacity="0.8">nothing is charged</text>
  <text x="450" y="154" font-size="11" fill="currentColor" opacity="0.8">the run is halted</text>

  <text x="450" y="188" font-size="11" fill="currentColor" opacity="0.75">not clipped back to</text>
  <text x="450" y="204" font-size="11" fill="currentColor" opacity="0.75">the boundary, and not</text>
  <text x="450" y="220" font-size="11" fill="currentColor" opacity="0.75">resumed on the other axis</text>
</svg>
<figcaption>Each charge is a step, and the declared limits are the edges of the region. The step that would leave it is refused whole — the path stops rather than being trimmed to fit, which is why nothing is partially charged.</figcaption>
</figure>

  <div class="stage" id="stage"></div>

  <div class="controls">
    <button id="prev">Back</button>
    <button id="next">Next</button>
    <button id="replay">Replay</button>
    <div class="dots" id="dots"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script id="trace" type="application/json">{
  "app": "bounded-execution-budget",
  "claim": "A run halts at the first action that would exceed a declared budget \u2014 the over-budget action never executes, nothing is partially charged, and the budget cannot be extended from inside the run.",
  "enforcement": "deterministic",
  "denial_type": "BudgetDenied",
  "steps": [
    {
      "label": "tool call 1 of a 3-call budget",
      "request": {
        "resource": "tool_calls",
        "amount": 1,
        "remaining_before": 3
      },
      "outcome": "allowed",
      "result": "toy-action-result",
      "reason": "",
      "detail": "",
      "evidence": "actions executed: 1",
      "note": ""
    },
    {
      "label": "tool call 2 of a 3-call budget",
      "request": {
        "resource": "tool_calls",
        "amount": 1,
        "remaining_before": 2
      },
      "outcome": "allowed",
      "result": "toy-action-result",
      "reason": "",
      "detail": "",
      "evidence": "actions executed: 2",
      "note": ""
    },
    {
      "label": "tool call 3 of a 3-call budget",
      "request": {
        "resource": "tool_calls",
        "amount": 1,
        "remaining_before": 1
      },
      "outcome": "allowed",
      "result": "toy-action-result",
      "reason": "",
      "detail": "",
      "evidence": "actions executed: 3",
      "note": ""
    },
    {
      "label": "the fourth call would cross the cap",
      "request": {
        "resource": "tool_calls",
        "amount": 1,
        "limit": 3,
        "spent": 3
      },
      "outcome": "denied",
      "result": "",
      "reason": "budget_exhausted",
      "detail": "resource=tool_calls limit=3 spent=3 requested=1",
      "evidence": "actions executed: 3 \u2014 unchanged",
      "note": "Checked before charging, charged before running."
    },
    {
      "label": "an affordable charge against a different resource, after the halt",
      "request": {
        "resource": "cost_units",
        "amount": 5,
        "remaining": 100
      },
      "outcome": "denied",
      "result": "",
      "reason": "run_halted",
      "detail": "budget_exhausted",
      "evidence": "actions executed: 3",
      "note": "A meter that keeps serving whatever still fits lets a run route around its own cap."
    },
    {
      "label": "a resource nobody declared",
      "request": {
        "resource": "gpu_seconds",
        "amount": 1,
        "declared": "tool_calls only"
      },
      "outcome": "denied",
      "result": "",
      "reason": "unknown_resource",
      "detail": "gpu_seconds",
      "evidence": "",
      "note": "Undeclared is refused, never free."
    }
  ]
}</script>
<script>
  const data = JSON.parse(document.getElementById("trace").textContent);
  const stage = document.getElementById("stage");
  const dots = document.getElementById("dots");
  let i = 0;

  document.getElementById("app").textContent = data.app;
  document.getElementById("claim").textContent = data.claim;
  document.getElementById("meta").textContent =
    data.enforcement + " · denials raise " + data.denial_type +
    " · " + data.steps.length + " steps";
  document.getElementById("foot").innerHTML =
    "Every step on this page was produced by running the app's real module, " +
    "not reimplemented in JavaScript. Regenerate with <code>python demo.py</code>.";

  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function render(n) {
    const s = data.steps[n];
    const req = Object.entries(s.request)
      .map(([k, v]) => k + ": " + (typeof v === "string" ? v : JSON.stringify(v)))
      .join("\n");

    let verdict = '<div class="verdict ' + s.outcome + '" data-outcome="' + s.outcome + '">' +
      '<div class="tag">' + (s.outcome === "allowed" ? "ALLOWED" : "DENIED") + "</div>";
    if (s.outcome === "denied") {
      verdict += '<div class="reason" data-reason="' + esc(s.reason) + '">' + esc(s.reason) + "</div>";
      if (s.detail) verdict += '<div class="detail">' + esc(s.detail) + "</div>";
    } else if (s.result) {
      verdict += '<div class="reason">' + esc(s.result) + "</div>";
    }
    verdict += "</div>";

    stage.innerHTML =
      '<div class="steplabel">Step ' + (n + 1) + " of " + data.steps.length +
        " — " + esc(s.label) + "</div>" +
      '<div class="request">' + esc(req) + "</div>" +
      '<div class="gate">&darr; gate &darr;</div>' +
      verdict +
      (s.evidence ? '<div class="evidence"><b>Evidence:</b> ' + esc(s.evidence) + "</div>" : "") +
      (s.note ? '<div class="note">' + esc(s.note) + "</div>" : "");

    dots.innerHTML = data.steps.map((st, k) =>
      '<div class="dot ' + (k === n ? "on" : k < n ? "done " + st.outcome : "") + '"></div>'
    ).join("");

    document.getElementById("prev").disabled = n === 0;
    document.getElementById("next").disabled = n === data.steps.length - 1;
    stage.dataset.step = String(n);
  }

  document.getElementById("next").onclick = () => render(++i);
  document.getElementById("prev").onclick = () => render(--i);
  document.getElementById("replay").onclick = () => render(i = 0);
  render(0);
</script>
</body>
</html>
